<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- VoidRecords Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=2">
    <link rel="shortcut icon" href="favicon.png?v=2">
    <link rel="apple-touch-icon" href="favicon.png?v=2">

    <title>VoidRecords - Login & Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-black: #0a0a0a;
            --secondary-black: #1a1a1a;
            --tertiary-black: #2a2a2a;
            --primary-white: #ffffff;
            --secondary-white: #f5f5f5;
            --gray-light: #e0e0e0;
            --accent: #ffffff;
            --success: #00d084;
            --error: #ff4757;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-black);
            color: var(--primary-white);
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            animation: slideInDown 0.6s ease-out;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-text {
            font-size: 24px;
            color: var(--primary-white);
            letter-spacing: 2px;
        }

        .logo-records {
            font-size: 14px;
            color: var(--gray-light);
            letter-spacing: 1px;
            border-left: 1px solid var(--accent);
            padding-left: 8px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: var(--gray-light);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            color: var(--primary-white);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: var(--error);
            color: var(--primary-white);
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: none;
        }

        .logout-btn:hover {
            background: #ff3838;
            transform: translateY(-2px);
        }

        .logout-btn.show {
            display: block;
        }

        .user-name {
            color: var(--gray-light);
            font-size: 14px;
            display: none;
        }

        .user-name.show {
            display: block;
        }

        /* Background Stars */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        /* Main Container */
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin-top: 70px;
            background: linear-gradient(135deg, var(--primary-black) 0%, var(--secondary-black) 100%);
        }

        /* Role Selection */
        .role-selection {
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        .role-selection h1 {
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .role-selection p {
            color: var(--gray-light);
            font-size: 18px;
            margin-bottom: 50px;
        }

        .role-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .role-btn {
            padding: 30px;
            background: var(--tertiary-black);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: var(--primary-white);
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease-out both;
        }

        .role-btn:nth-child(1) {
            animation-delay: 0.1s;
        }

        .role-btn:nth-child(2) {
            animation-delay: 0.2s;
        }

        .role-btn:nth-child(3) {
            animation-delay: 0.3s;
        }

        .role-btn:hover {
            border-color: var(--primary-white);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        /* Auth Container */
        .auth-container {
            max-width: 500px;
            background: var(--secondary-black);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 50px;
            animation: fadeInUp 0.8s ease-out;
            display: none;
        }

        .auth-container.show {
            display: block;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--gray-light);
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn:hover {
            color: var(--primary-white);
        }

        .auth-title {
            font-size: 36px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .auth-subtitle {
            color: var(--gray-light);
            margin-bottom: 40px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: var(--tertiary-black);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--primary-white);
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-white);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-white);
            color: var(--primary-black);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: var(--gray-light);
            font-size: 14px;
        }

        .toggle-form button {
            background: none;
            border: none;
            color: var(--primary-white);
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
        }

        .toggle-form button:hover {
            color: var(--gray-light);
        }

        /* Messages */
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(0, 208, 132, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.error {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid var(--error);
            color: var(--error);
        }

        /* Dashboard */
        .dashboard {
            display: none;
            animation: fadeInUp 0.8s ease-out;
        }

        .dashboard.show {
            display: block;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .dashboard-header h1 {
            font-size: 48px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .dashboard-header p {
            color: var(--gray-light);
            font-size: 18px;
        }

        .dashboard-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .dashboard-card {
            background: var(--secondary-black);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 30px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out both;
        }

        .dashboard-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .dashboard-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dashboard-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .dashboard-card:hover {
            border-color: var(--primary-white);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        .dashboard-card h3 {
            font-size: 24px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .dashboard-card p {
            color: var(--gray-light);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .card-btn {
            background: var(--primary-white);
            color: var(--primary-black);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .card-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-container {
                padding: 30px;
                max-width: 100%;
            }

            .auth-title {
                font-size: 28px;
            }

            .role-buttons {
                grid-template-columns: 1fr;
            }

            .nav-menu {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Stars Background -->
    <div class="stars-bg"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                <span class="logo-text">VOID</span>
                <span class="logo-records">RECORDS</span>
            </a>

            <ul class="nav-menu">
                <li>
                    <a href="index.html" class="nav-link">Home</a>
                </li>

                <li>
                    <a href="index.html#artists" class="nav-link">Artists</a>
                </li>

                <li>
                    <a href="index.html#releases" class="nav-link">Releases</a>
                </li>
            </ul>

            <div class="user-info">
                <span class="user-name" id="userName"></span>

                <button
                    class="logout-btn"
                    id="logoutBtn">
                    Logout
                </button>
            </div>

        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">

        <!-- Role Selection -->
        <div
            class="role-selection"
            id="roleSelection">

            <h1>Select Your Role</h1>

            <p>
                Choose how you want to connect with VoidRecords
            </p>

            <div class="role-buttons">

                <button
                    class="role-btn"
                    onclick="selectRole('artist')">
                    🎤 Artist
                </button>

                <button
                    class="role-btn"
                    onclick="selectRole('ar')">
                    🎧 A&amp;R Manager
                </button>

                <button
                    class="role-btn"
                    onclick="selectRole('owner')">
                    👑 Owner
                </button>

            </div>
        </div>

        <!-- Auth Forms -->
        <div
            class="auth-container"
            id="authContainer">

            <button
                class="back-btn"
                onclick="goBack()">
                ← Back
            </button>

            <div id="messageContainer"></div>

            <!-- Login Form -->
            <div id="loginForm">

                <h2 class="auth-title">
                    Welcome Back
                </h2>

                <p class="auth-subtitle">
                    Sign in to your account
                </p>

                <form onsubmit="handleLogin(event)">

                    <div class="form-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="submit-btn">
                        Login
                    </button>

                </form>

                <div class="toggle-form">
                    Don't have an account?

                    <button onclick="toggleForm()">
                        Sign Up
                    </button>
                </div>

            </div>

            <!-- Registration Form -->
            <div
                id="signupForm"
                style="display: none;">

                <h2 class="auth-title">
                    Create Account
                </h2>

                <p class="auth-subtitle">
                    Join VoidRecords Community
                </p>

                <form onsubmit="handleSignup(event)">

                    <div class="form-group">

                        <label for="signupName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your full name"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="signupEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password (min 6 characters)"
                            required
                            minlength="6">

                    </div>

                    <div class="form-group">

                        <label for="signupConfirm">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="signupConfirm"
                            placeholder="Confirm your password"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="submit-btn">
                        Create Account
                    </button>

                </form>

                <div class="toggle-form">
                    Already have an account?

                    <button onclick="toggleForm()">
                        Sign In
                    </button>
                </div>

            </div>

        </div>

        <!-- Dashboard -->
        <div
            class="dashboard"
            id="dashboard">

            <div class="dashboard-header">

                <h1 id="dashboardTitle">
                    Dashboard
                </h1>

                <p id="dashboardSubtitle">
                    Welcome to your VoidRecords portal
                </p>

            </div>

            <div
                class="dashboard-content"
                id="dashboardContent">
                <!-- Content loaded dynamically -->
            </div>

        </div>

    </div>

    <script>

        // Initialize app
        let currentRole = null;
        let currentUser = null;

        const OWNER_EMAIL =
            'voidrecords287@gmail.com';

        const OWNER_PASSWORD =
            'gamerskory2210';


        // Create stars background
        function createStars() {

            const starsBg =
                document.querySelector('.stars-bg');

            for (let i = 0; i < 50; i++) {

                const star =
                    document.createElement('div');

                star.className = 'star';

                star.style.left =
                    Math.random() * 100 + '%';

                star.style.top =
                    Math.random() * 100 + '%';

                star.style.animationDelay =
                    Math.random() * 3 + 's';

                starsBg.appendChild(star);
            }
        }

        createStars();


        // Role Selection
        function selectRole(role) {

            currentRole = role;

            document.getElementById(
                'roleSelection'
            ).style.display = 'none';

            document.getElementById(
                'authContainer'
            ).classList.add('show');
        }


        // Go Back
        function goBack() {

            currentRole = null;

            document.getElementById(
                'roleSelection'
            ).style.display = 'block';

            document.getElementById(
                'authContainer'
            ).classList.remove('show');

            document.getElementById(
                'loginForm'
            ).style.display = 'block';

            document.getElementById(
                'signupForm'
            ).style.display = 'none';

            clearForms();
            clearMessage();
        }


        // Toggle between Login and Signup
        function toggleForm() {

            const loginForm =
                document.getElementById('loginForm');

            const signupForm =
                document.getElementById('signupForm');

            if (loginForm.style.display === 'none') {

                loginForm.style.display = 'block';
                signupForm.style.display = 'none';

            } else {

                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }

            clearMessage();
        }


        // Show Message
        function showMessage(text, type) {

            const container =
                document.getElementById(
                    'messageContainer'
                );

            container.innerHTML =
                `<div class="message ${type} show">${text}</div>`;

            if (type === 'success') {

                setTimeout(() => {
                    container.innerHTML = '';
                }, 3000);
            }
        }


        // Clear Message
        function clearMessage() {

            document.getElementById(
                'messageContainer'
            ).innerHTML = '';
        }


        // Clear Forms
        function clearForms() {

            document
                .getElementById('loginForm')
                .querySelectorAll('input')
                .forEach(input => {
                    input.value = '';
                });

            document
                .getElementById('signupForm')
                .querySelectorAll('input')
                .forEach(input => {
                    input.value = '';
                });
        }


        // Handle Login
        function handleLogin(event) {

            event.preventDefault();

            const email =
                document.getElementById(
                    'loginEmail'
                ).value;

            const password =
                document.getElementById(
                    'loginPassword'
                ).value;


            // Check if owner
            if (currentRole === 'owner') {

                if (
                    email === OWNER_EMAIL &&
                    password === OWNER_PASSWORD
                ) {

                    currentUser = {
                        name: 'VoidRecords Owner',
                        email: email,
                        role: 'owner'
                    };

                    showDashboard();

                    showMessage(
                        '✓ Welcome back, Owner!',
                        'success'
                    );

                } else {

                    showMessage(
                        '✗ Invalid owner credentials. Please try again.',
                        'error'
                    );
                }

            } else {

                // Check localStorage for regular users
                const users =
                    JSON.parse(
                        localStorage.getItem(
                            'voidrecords_users'
                        ) || '{}'
                    );

                const userKey =
                    currentRole + '_' + email;


                if (
                    users[userKey] &&
                    users[userKey].password === password
                ) {

                    currentUser = {
                        name: users[userKey].name,
                        email: email,
                        role: currentRole
                    };

                    showDashboard();

                    showMessage(
                        '✓ Login successful!',
                        'success'
                    );

                } else {

                    showMessage(
                        '✗ Invalid email or password. Please try again.',
                        'error'
                    );
                }
            }
        }


        // Handle Signup
        function handleSignup(event) {

            event.preventDefault();

            if (currentRole === 'owner') {

                showMessage(
                    '✗ Owner accounts cannot be created. Only the default owner account is available.',
                    'error'
                );

                return;
            }

            const name =
                document.getElementById(
                    'signupName'
                ).value;

            const email =
                document.getElementById(
                    'signupEmail'
                ).value;

            const password =
                document.getElementById(
                    'signupPassword'
                ).value;

            const confirm =
                document.getElementById(
                    'signupConfirm'
                ).value;


            if (password !== confirm) {

                showMessage(
                    '✗ Passwords do not match.',
                    'error'
                );

                return;
            }


            // Save to localStorage
            const users =
                JSON.parse(
                    localStorage.getItem(
                        'voidrecords_users'
                    ) || '{}'
                );

            const userKey =
                currentRole + '_' + email;


            if (users[userKey]) {

                showMessage(
                    '✗ This email is already registered.',
                    'error'
                );

                return;
            }


            users[userKey] = {
                name: name,
                email: email,
                password: password,
                role: currentRole
            };


            localStorage.setItem(
                'voidrecords_users',
                JSON.stringify(users)
            );


            currentUser = {
                name: name,
                email: email,
                role: currentRole
            };


            showDashboard();

            showMessage(
                '✓ Account created and logged in!',
                'success'
            );
        }


        // Show Dashboard
        function showDashboard() {

            document.getElementById(
                'authContainer'
            ).classList.remove('show');

            document.getElementById(
                'dashboard'
            ).classList.add('show');

            document.getElementById(
                'userName'
            ).textContent =
                `Welcome, ${currentUser.name}`;

            document.getElementById(
                'userName'
            ).classList.add('show');

            document.getElementById(
                'logoutBtn'
            ).classList.add('show');


            const title =
                document.getElementById(
                    'dashboardTitle'
                );

            const subtitle =
                document.getElementById(
                    'dashboardSubtitle'
                );

            const content =
                document.getElementById(
                    'dashboardContent'
                );


            if (currentUser.role === 'owner') {

                title.textContent =

        // Check if user is already logged in
        window.addEventListener('load', () => {

            const savedUser =
                localStorage.getItem(
                    'voidrecords_currentUser'
                );

            if (savedUser) {

                currentUser =
                    JSON.parse(savedUser);

                currentRole =
                    currentUser.role;

                showDashboard();
            }
        });


        // Save user to localStorage when logging in
        const originalShowDashboard =
            showDashboard;

        showDashboard = function() {

            localStorage.setItem(
                'voidrecords_currentUser',
                JSON.stringify(currentUser)
            );
