<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoidRecords - Page Not Found</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #0a0a0a;
            --dark: #151515;
            --gray: #2a2a2a;
            --white: #ffffff;
            --light: #e0e0e0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at center, #202020 0%, #0a0a0a 65%);
            color: var(--white);
            overflow: hidden;
        }

        /* Stars */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.15;
            }

            50% {
                opacity: 1;
            }
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-text {
            color: white;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo-records {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 1px;
            padding-left: 8px;
            border-left: 1px solid white;
        }

        .home-link {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .home-link:hover {
            color: white;
        }

        /* Main */
        .error-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px 40px;
            position: relative;
            z-index: 2;
        }

        .error-content {
            max-width: 700px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 404 */
        .error-code {
            font-size: clamp(100px, 22vw, 220px);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: 10px;

            background: linear-gradient(
                180deg,
                #ffffff,
                #555555
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow: 0 0 50px rgba(255,255,255,0.08);
            margin-bottom: 30px;
        }

        .error-title {
            font-size: clamp(28px, 5vw, 48px);
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .error-message {
            color: #aaa;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        /* Button */
        .home-button {
            display: inline-block;
            padding: 14px 40px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 2px solid white;
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background: transparent;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.15);
        }

        /* Vinyl */
        .vinyl {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 35px auto 0;

            background:
                repeating-radial-gradient(
                    circle,
                    #111 0px,
                    #111 3px,
                    #181818 4px,
                    #111 6px
                );

            border: 2px solid #444;
            position: relative;
            animation: spin 8s linear infinite;
        }

        .vinyl::before {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #777;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .vinyl::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #555;
            font-size: 12px;
            letter-spacing: 0.5px;
            z-index: 3;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .logo-records {
                display: none;
            }

            .home-link {
                font-size: 12px;
            }

            .error-code {
                letter-spacing: 5px;
            }

            .error-message {
                font-size: 15px;
            }

            .home-button {
                padding: 12px 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                <span class="logo-text">VOID</span>
                <span class="logo-records">RECORDS</span>
            </a>

            <a href="index.html" class="home-link">
                Return Home
            </a>

        </div>
    </nav>

    <!-- Error -->
    <main class="error-container">

        <div class="error-content">

            <div class="error-code">404</div>

            <h1 class="error-title">
                Lost in the Void
            </h1>

            <p class="error-message">
                The page you're looking for doesn't exist,
                was moved, or disappeared into the void.
                <br>
                Don't worry — the music is still here.
            </p>

            <a href="index.html" class="home-button">
                ← Return to VoidRecords
            </a>

            <div class="vinyl"></div>

        </div>

    </main>

    <footer class="footer">
        © 2026 VoidRecords — Where music Meets the Void
    </footer>

    <script>
        // Create random stars
        const stars = document.getElementById('stars');

        for (let i = 0; i < 80; i++) {

            const star = document.createElement('div');

            star.className = 'star';

            star.style.left =
                Math.random() * 100 + '%';

            star.style.top =
                Math.random() * 100 + '%';

            star.style.animationDelay =
                Math.random() * 3 + 's';

            star.style.opacity =
                Math.random();

            stars.appendChild(star);
        }
    </script>

</body>
</html>
